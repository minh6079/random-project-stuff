<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tic Tac Toe</title>
<style>
:root{--bg:#f2f5f8;--card:#fff;--tx:#14202b;--mut:#5b6b79;--bd:#c3d0db;--acc:#1f6feb;--x:#e5484d;--o:#1f6feb;--win:#ffe9a8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d151c;--card:#16212b;--tx:#e6edf3;--mut:#8fa1b0;--bd:#2c3c4a;--x:#ff6b70;--o:#5b9bff;--win:#4a4020;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d151c;--card:#16212b;--tx:#e6edf3;--mut:#8fa1b0;--bd:#2c3c4a;--x:#ff6b70;--o:#5b9bff;--win:#4a4020;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{margin:0 0 4px;font-size:1.6rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
#status{padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--bd);font-weight:600;min-height:44px}
#score{display:flex;gap:8px;margin:10px 0}
#score div{flex:1;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px}
#score b{display:block;font-size:1.3rem}
#bd{--n:3;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:clamp(3px,1.2vw,8px);margin:14px auto;max-width:480px;touch-action:manipulation}
.cell{aspect-ratio:1;border-radius:12px;background:var(--card);border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:calc(min(480px,100vw - 32px)/var(--n)*.58);font-weight:800;padding:0;line-height:1}
.cell.X{color:var(--x)}.cell.O{color:var(--o)}
.cell.win{background:var(--win)}
#bd.live .cell:not(.X):not(.O):hover{border-color:var(--acc);cursor:pointer}
#bd.live .cell:not(.X):not(.O):hover::after{content:"X";color:var(--x);opacity:.3}
.hint{color:var(--mut);font-size:.85rem}
</style></head>
<body><main>
<h1>Tic Tac Toe</h1>
<div class="hint" id="goal"></div>
<div class="bar">
 <label>Robot level <select id="lvl"><option value="easy">Easy</option><option value="mid">Medium</option><option value="hard">Hard</option></select></label>
 <label>Grid <select id="gs"></select></label>
 <label>In a row <select id="kk"></select></label>
 <label>Goes first <select id="first"><option value="p">You</option><option value="r">Robot</option></select></label>
 <button id="new" class="pri">New round</button>
 <button id="theme">Theme: Auto</button>
</div>
<div id="status"></div>
<div id="score"><div><b id="sw">0</b>You</div><div><b id="sd">0</b>Draws</div><div><b id="sl">0</b>Robot</div></div>
<div id="bd"></div>
<p class="hint">Easy: random moves. Medium: wins or blocks when it can, otherwise random. Hard: on 3×3 it searches every possible game and never loses. On bigger grids it looks a few moves ahead with alpha-beta pruning and scores every possible line.</p>
</main>
<script>
const $=id=>document.getElementById(id),rnd=a=>a[Math.floor(Math.random()*a.length)];
const DIRS=[[0,1],[1,0],[1,1],[1,-1]];
let N=3,K=3,b,turn,over,sc={w:0,d:0,l:0},line=[],ORD=[],FULL=false;
const defaultK=n=>n<=3?3:n===4?4:Math.min(5,n);
function mkOrd(){const m=(N-1)/2;ORD=[...Array(N*N).keys()].sort((a,c)=>Math.hypot(Math.floor(a/N)-m,a%N-m)-Math.hypot(Math.floor(c/N)-m,c%N-m))}
function lineAt(b,i,p){
  const r0=Math.floor(i/N),c0=i%N;
  for(const[dr,dc]of DIRS){
    const cells=[i];
    for(const s of[1,-1]){let r=r0+dr*s,c=c0+dc*s;while(r>=0&&r<N&&c>=0&&c<N&&b[r*N+c]===p){cells.push(r*N+c);r+=dr*s;c+=dc*s}}
    if(cells.length>=K)return cells}
  return null}
const free=b=>{const f=[];for(let i=0;i<b.length;i++)if(!b[i])f.push(i);return f};
function immediate(p){for(const i of free(b)){b[i]=p;const w=lineAt(b,i,p);b[i]="";if(w)return i}return-1}
/* ---------- Robot algorithms ---------- */
const aiEasy=()=>rnd(free(b));
function aiMid(){let m=immediate("O");if(m>=0)return m;m=immediate("X");if(m>=0)return m;return rnd(free(b))}
function evalT(b){
  let s=0;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const[dr,dc]of DIRS){
    const er=r+(K-1)*dr,ec=c+(K-1)*dc;if(er<0||er>=N||ec<0||ec>=N)continue;
    let m=0,t=0;for(let k=0;k<K;k++){const v=b[(r+k*dr)*N+c+k*dc];if(v==="O")m++;else if(v==="X")t++}
    if(m&&t)continue;
    if(m)s+=Math.pow(8,m);else if(t)s-=Math.pow(8,t)*1.2}
  return s}
function cands(b){ // empty cells (centre first); on big boards only cells near existing marks
  const out=[];
  for(const i of ORD){
    if(b[i])continue;
    if(FULL){out.push(i);continue}
    const r=Math.floor(i/N),c=i%N;let near=false;
    const RD=N>6?1:2;for(let dr=-RD;dr<=RD&&!near;dr++)for(let dc=-RD;dc<=RD;dc++){const rr=r+dr,cc=c+dc;if(rr>=0&&rr<N&&cc>=0&&cc<N&&b[rr*N+cc]){near=true;break}}
    if(near)out.push(i)}
  if(!out.length){const e=ORD.find(i=>!b[i]);if(e!==undefined)out.push(e)}
  return out}
function ab(b,d,al,be,max,li,lp){
  if(lineAt(b,li,lp))return lp==="O"?1e6+d:-1e6-d;
  const cs=cands(b);
  if(!cs.length)return 0;
  if(d<=0)return evalT(b);
  let best=max?-Infinity:Infinity;const p=max?"O":"X";
  for(const i of cs){
    b[i]=p;const v=ab(b,d-1,al,be,!max,i,p);b[i]="";
    if(max){best=Math.max(best,v);al=Math.max(al,v)}else{best=Math.min(best,v);be=Math.min(be,v)}
    if(al>=be)break}
  return best}
function aiHard(){
  let m=immediate("O");if(m>=0)return m;m=immediate("X");if(m>=0)return m;
  const f=free(b);FULL=f.length<=9;
  const D=FULL?f.length:(N<=5?4:N<=8?3:2);
  let best=-Infinity,mv=[];
  for(const i of cands(b)){
    b[i]="O";const v=ab(b,D-1,-Infinity,Infinity,false,i,"O");b[i]="";
    if(v>best){best=v;mv=[i]}else if(v===best)mv.push(i)}
  return rnd(mv)}
const AI={easy:aiEasy,mid:aiMid,hard:aiHard};

/* ---------- Game ---------- */
const msg=t=>$("status").textContent=t;
function render(){
  const bd=$("bd");bd.style.setProperty("--n",N);
  if(bd.children.length!==N*N)bd.innerHTML=Array.from({length:N*N},(_,i)=>`<button class="cell" data-i="${i}" aria-label="Cell ${i+1}"></button>`).join("");
  [...bd.children].forEach((d,i)=>{d.textContent=b[i];d.className="cell"+(b[i]?" "+b[i]:"")+(line.includes(i)?" win":"")});
  bd.classList.toggle("live",!over&&turn==="X");
  $("sw").textContent=sc.w;$("sd").textContent=sc.d;$("sl").textContent=sc.l;
  $("goal").textContent=`You are X. The robot is O. Get ${K} in a row on a ${N}×${N} grid.`}
function finish(i,p){
  const w=lineAt(b,i,p);
  if(w){over=true;line=w;if(p==="X"){sc.w++;msg("🎉 You win!")}else{sc.l++;msg("The robot wins.")}return true}
  if(!free(b).length){over=true;sc.d++;msg("It’s a draw.");return true}
  return false}
function robot(){
  if(over)return;
  const m=AI[$("lvl").value]();b[m]="O";
  if(!finish(m,"O")){turn="X";msg("Your turn (X).")}
  render()}
function start(){
  b=Array(N*N).fill("");over=false;line=[];
  if($("first").value==="r"){turn="O";msg("Robot is thinking…");render();setTimeout(robot,450)}
  else{turn="X";msg("Your turn (X).");render()}}
$("bd").addEventListener("click",e=>{
  const el=e.target.closest(".cell");if(!el)return;const k=+el.dataset.i;
  if(over||turn!=="X"||b[k])return;
  b[k]="X";
  if(finish(k,"X")){render();return}
  turn="O";msg("Robot is thinking…");render();setTimeout(robot,450)});
function fillSel(id,from,to,sel,fmt){const s=$(id);s.innerHTML="";for(let v=from;v<=to;v++)s.add(new Option(fmt(v),v));s.value=sel}
function newSettings(){sc={w:0,d:0,l:0};mkOrd();start()}
$("gs").onchange=()=>{N=+$("gs").value;K=defaultK(N);fillSel("kk",3,N,K,v=>v);newSettings()};
$("kk").onchange=()=>{K=+$("kk").value;newSettings()};
$("new").onclick=start;
const MODES=["auto","light","dark"],ICON={auto:"🖥️ Auto",light:"☀️ Light",dark:"🌙 Dark"};
let mode="auto";
try{const m=localStorage.getItem("ttt-theme");if(MODES.includes(m))mode=m}catch(e){}
function applyTheme(){const r=document.documentElement;if(mode==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",mode);$("theme").textContent="Theme: "+ICON[mode]}
$("theme").onclick=()=>{mode=MODES[(MODES.indexOf(mode)+1)%3];applyTheme();try{localStorage.setItem("ttt-theme",mode)}catch(e){}};
fillSel("gs",3,10,N,v=>v+"×"+v);fillSel("kk",3,N,K,v=>v);
applyTheme();mkOrd();start();
</script></body></html>
